<h2>Reactive Student Registration</h2>


<form [formGroup]="studentForm" (ngSubmit)="submitForm()">


    <label>Name:</label>

    <input type="text" formControlName="name">


    <br><br>


    <label>Email:</label>

    <input type="email" formControlName="email">


    <br><br>


    <label>Course:</label>

    <select formControlName="course">

        <option>Angular</option>

        <option>.NET Core</option>

        <option>SQL</option>

    </select>


    <br><br>


    <button type="submit">
        Submit
    </button>


</form>


<h3>Form Data:</h3>

<p>
    {{studentForm.value.name}}
</p>

<p>
    {{studentForm.value.email}}
</p>

<p>
    {{studentForm.value.course}}
</p>
